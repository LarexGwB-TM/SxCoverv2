<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SX Dashboard | Üyelik Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Üst Bar -->
        <header class="dashboard-header">
            <h1>SX Dashboard</h1>
            <div class="user-profile">Hoş geldin, Kullanıcı</div>
        </header>

        <!-- Ürünler (Pricing) Bölümü -->
        <section class="products-section">
            <h2 class="section-title">Üyelik Paketleri</h2>
            <div class="pricing-grid">
                <div class="package">
                    <h4>1 Haftalık</h4>
                    <p>Temel erişim.</p>
                    <button class="buy-btn">Satın Al</button>
                </div>
                <div class="package">
                    <h4>1 Aylık</h4>
                    <p>Standart erişim.</p>
                    <button class="buy-btn">Satın Al</button>
                </div>
                <div class="package">
                    <h4>1 Yıllık</h4>
                    <p>Avantajlı seçim.</p>
                    <button class="buy-btn">Satın Al</button>
                </div>
                
                <!-- Dev Kampanya / Sınırsız -->
                <div class="package featured">
                    <span class="badge">DEV KAMPANYA</span>
                    <h3>Sınırsız Üyelik</h3>
                    <p>Tüm özellikler + <b>Discord Mod+ Yetkisi</b></p>
                    <button class="buy-btn-featured">Hemen Al</button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
