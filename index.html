<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SX Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>SX Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>Funnel Oluştur</li>
            <li>Üyelik Planları</li>
            <li>Destek</li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Hoş Geldin, Larex!</h1>
        </header>

        <div class="stats-grid">
            <div class="card"><h3>Total Members</h3><p>0</p></div>
            <div class="card"><h3>Active Funnels</h3><p>0</p></div>
        </div>

        <section class="shop">
            <h2>Üyelik ve Yetki Paketleri</h2>
            <div class="pricing-grid">
                <div class="item"><h4>1 Haftalık</h4><p>Deneme Erişimi</p><button>Satın Al</button></div>
                <div class="item"><h4>1 Aylık</h4><p>Standart Erişim</p><button>Satın Al</button></div>
                <div class="item"><h4>1 Yıllık</h4><p>Avantajlı</p><button>Satın Al</button></div>
                <div class="item featured">
                    <span class="badge">DEV KAMPANYA</span>
                    <h3>Sınırsız</h3>
                    <p>Sada Mod+ Yetkisi Dahil!</p>
                    <button class="buy-btn">Hemen Satın Al</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
